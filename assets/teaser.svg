<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="An additive fix localized by VulSpot: the inserted NULL check is anchored on the memcpy that uses the unchecked pointer">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 13px; }
  </style>
  <rect x="1" y="1" width="878" height="268" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <text x="24" y="34" class="sans" font-size="15" font-weight="700" fill="#1f2a44">CVE-2017-6435 (libplist): the fix only&#160;<tspan fill="#1a7f37">adds</tspan>&#160;a NULL check</text>
  <text x="24" y="54" class="sans" font-size="12" fill="#57606a">Vulnerable function, with the line inserted by the fix shown in green</text>

  <!-- code panel -->
  <rect x="24" y="68" width="520" height="140" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
  <text x="40" y="96" class="mono" fill="#24292f">data-&gt;strval = (char *) malloc(sizeof(char)*(size+1));</text>
  <rect x="32" y="108" width="504" height="24" rx="4" fill="#dafbe1"/>
  <text x="40" y="125" class="mono" fill="#1a7f37">+ if (!data-&gt;strval) { plist_free_data(data); return NULL; }</text>
  <rect x="32" y="140" width="504" height="24" rx="4" fill="#ffedd5" stroke="#f28c28" stroke-width="1.5"/>
  <text x="40" y="157" class="mono" fill="#24292f" font-weight="700">memcpy(data-&gt;strval, *bnode, size);</text>
  <text x="40" y="189" class="mono" fill="#24292f">data-&gt;strval[size] = '\0';</text>

  <path d="M536,152 C556,152 556,190 572,190" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ah)"/>

  <!-- right: label comparison -->
  <rect x="576" y="68" width="280" height="62" rx="8" fill="#fff5f5" stroke="#f1aeb5"/>
  <text x="592" y="91" class="sans" font-size="12.5" font-weight="700" fill="#b42318">Diff-based label (deleted / modified lines)</text>
  <text x="592" y="115" class="sans" font-size="13" fill="#24292f"><tspan font-weight="700" fill="#b42318">∅</tspan>&#160;&#160;no line marked: empty location</text>

  <rect x="576" y="146" width="280" height="62" rx="8" fill="#fff7ed" stroke="#f28c28"/>
  <text x="592" y="169" class="sans" font-size="12.5" font-weight="700" fill="#c2410c">VulSpot sink candidate</text>
  <text x="592" y="193" class="sans" font-size="13" fill="#24292f"><tspan class="mono" font-size="12">memcpy</tspan>&#160;· anchor_dataflow · guard_use_strict</text>

  <text x="24" y="242" class="sans" font-size="12.5" fill="#57606a">In&#160;<tspan font-weight="700" fill="#1f2a44">32.6%</tspan>&#160;of vulnerable C/C++ functions the fix only inserts code. VulSpot anchors these insertions and localizes&#160;<tspan font-weight="700" fill="#1f2a44">99.3%</tspan>&#160;of the functions</text>
  <text x="24" y="258" class="sans" font-size="12.5" fill="#57606a">that diff-based labels leave empty.</text>
</svg>
